<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDX Mod Hub</title>
    <!-- One canonical mark, in every form anything asks for. The browser
         takes the last <link rel=icon> it understands, so the SVG must
         follow the ICO. Regenerate with .uishots/icons/gen.py. -->
    <link rel="icon" href="/brand/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Pre-paint theme resolution (public/theme-init.js). A blocking classic
         script, so it runs before first paint and before the module bundle;
         a same-origin file because the CSP (script-src 'self') refuses
         inline scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
